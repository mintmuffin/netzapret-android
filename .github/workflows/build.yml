name: Build portable release

on:
  push:
    branches: [main, arena/403fee8f-netzapret-android]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Linux portable zip
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          rm -rf portable && mkdir -p portable/netzapret
          python -m venv portable/netzapret/.venv
          portable/netzapret/.venv/bin/python -m pip install --quiet -r requirements.txt
          cp -r src portable/netzapret/src
          printf '#!/bin/sh\nDIR="$(cd "$(dirname "$0")" && pwd)"\nexec "$DIR/.venv/bin/python" "$DIR/src/main.py" "$@"\n' > portable/netzapret/netzapret
          chmod +x portable/netzapret/netzapret
          cd portable && zip -r netzapret-linux.zip netzapret && mv netzapret-linux.zip ../netzapret-linux.zip
          ls -la ../netzapret-linux.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netzapret-linux
          path: netzapret-linux.zip

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wine + Windows Python
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wine p7zip-full curl
          curl -L -o python-embed.zip https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip
          7z x python-embed.zip -owinpython >/dev/null
          sed -i 's/^# *import site/import site/' winpython/python311._pth 2>/dev/null || true
          echo "WINPY=$PWD/winpython" >> $GITHUB_ENV
      - name: Install Python deps under Wine
        run: |
          curl -L -o get-pip.py https://bootstrap.pypa.io/get-pip.py
          wine "$WINPY/python.exe" get-pip.py || true
          wine "$WINPY/python.exe" -m pip install --upgrade pip || true
          wine "$WINPY/python.exe" -m pip install pygame numpy pyinstaller || true
      - name: Build Windows exe with PyInstaller (via Wine)
        run: |
          wine "$WINPY/python.exe" -m PyInstaller --onedir --noconfirm --name netzapret --distpath dist/win src/main.py
      - name: Zip portable folder
        run: cd dist/win && zip -r netzapret-windows.zip netzapret
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netzapret-windows
          path: dist/win/netzapret-windows.zip
