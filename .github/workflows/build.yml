name: Build portable release

on:
  push:
    branches: [main, arena/403fee8f-netzapret-android]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build with PyInstaller (one-folder portable)
        run: pyinstaller netzapret.spec -y --distpath dist/linux
      - name: Zip portable folder
        run: cd dist/linux && zip -r netzapret-linux.zip netzapret
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netzapret-linux
          path: dist/linux/netzapret-linux.zip

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wine + Windows Python
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wine p7zip-full curl
          curl -L -o python-embed.zip \
            https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip
          7z x python-embed.zip -owinpython >/dev/null
          echo "WINPY=$PWD/winpython" >> $GITHUB_ENV
      - name: Install Python deps under Wine
        run: |
          curl -L -o get-pip.py https://bootstrap.pypa.io/get-pip.py
          wine "$WINPY/python.exe" get-pip.py
          wine "$WINPY/python.exe" -m pip install --upgrade pip
          wine "$WINPY/python.exe" -m pip install pygame numpy pyinstaller
      - name: Build Windows exe with PyInstaller (via Wine)
        run: wine "$WINPY/python.exe" -m PyInstaller netzapret.spec -y --distpath dist/win
      - name: Zip portable folder
        run: cd dist/win && zip -r netzapret-windows.zip netzapret
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netzapret-windows
          path: dist/win/netzapret-windows.zip

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/*/netzapret-*.zip --clobber
