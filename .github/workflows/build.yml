name: Build Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build Windows exe with PyInstaller
        run: pyinstaller --onedir --windowed --noconfirm --name netzapret --distpath dist/win --hidden-import=pygame --hidden-import=pygame.locals src/main.py
      - name: Zip portable folder
        run: cd dist/win && 7z a netzapret-windows.zip netzapret
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netzapret-windows
          path: dist/win/netzapret-windows.zip

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: netzapret-windows
          path: dist
      - name: Create or update release and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          ASSET=dist/netzapret-windows.zip
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$ASSET" --clobber
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$ASSET"
          fi
